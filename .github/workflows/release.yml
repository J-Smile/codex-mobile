name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布正式版本供桌面自动更新（版本号取自所选分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            architecture: x64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - run: npm ci
      - name: Check release versions
        id: version
        run: npm run release:check
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Configure Windows release profile
        if: runner.os == 'Windows'
        # 在恢复缓存前导出，让编译配置参与缓存键计算。
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_PROFILE_RELEASE_LTO=false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows 旧缓存由取消的作业写入，缺少 release 编译产物。
          key: ${{ runner.os == 'Windows' && 'windows-x64-package' || matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: npm run test:native
      - run: npm run test:relay
      - run: cargo clippy --locked -p codex-mobile-bridge -p codex-mobile-relay --all-targets -- -D warnings
      - run: npm run package
      - run: cargo clippy --locked -p codex-mobile-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
            dist/release/*-setup.dmg
            dist/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mobile-*
          path: dist/release
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::正式版本 $RELEASE_TAG 已发布。请提高版本号后重新运行，不能覆盖桌面已安装的同版本。"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          本次更新

          - 恢复队列中的“立即发送”：任务运行中点击 ▶，将所选消息追加到当前轮次，无需先停止；空闲时立即执行。
          - 保留原消息的文字、图片与其他附件，只移除所选项，不改变剩余队列顺序。
          - 官方确认接收后才移除队列；移除失败时再次操作只补做移除，发送结果未确认时不会盲目重发。
          - Windows 与 macOS 复用同一实现，手机横竖屏和桌面网页入口行为一致。

          运行包无需 Node.js。Windows 使用安装程序或完整 ZIP，Apple 芯片 macOS 使用 DMG 或完整 ZIP。后续公开 Release 可直接检查更新，无需 GitHub token。

          已核对当前官方桌面队列逻辑与 App Server 文档；本轮通过隔离协议回归、网页测试、构建及 Chromium 手机/桌面尺寸模拟。两平台 CI 继续验证 Rust、Clippy、安装包及包内 HTTP 资源；本轮未向真实业务聊天发送测试消息，未进行实体手机或 Windows 官方桌面实机验收。macOS 使用 ad-hoc 签名，尚未 Apple 公证；首次打开可能仍需在系统隐私与安全性中允许。
          EOF
          if [ "$existing" = true ]; then
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --notes-file release-notes.md --title "Codex Mobile $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

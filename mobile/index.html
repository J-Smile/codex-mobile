<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <script src="/startup.js"></script>
    <style>
      :root { --startup-background: #fff; --startup-text: #202023; --startup-muted: #68686d; color-scheme: light; }
      :root[data-theme="dark"] { --startup-background: #1c1c1e; --startup-text: #f2f2f3; --startup-muted: #aaaab0; color-scheme: dark; }
      html, body, #app { background-color: var(--chrome-background, var(--startup-background)); }
      body { margin: 0; }
      .startup-screen { display: grid; place-content: center; gap: 12px; box-sizing: border-box; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); color: var(--startup-text); text-align: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .startup-screen h1 { margin: 0; font-size: 20px; line-height: 1.4; font-weight: 600; }
      .startup-screen p { margin: 0; color: var(--startup-muted); font-size: 16px; line-height: 1.5; }
      .startup-screen button { justify-self: center; min-height: 48px; margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 12px; background: var(--startup-text); color: var(--startup-background); font: inherit; cursor: pointer; }
      .startup-screen button:focus-visible { outline: 2px solid var(--startup-text); outline-offset: 3px; }
    </style>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Codex Mobile</title>
  </head>
  <body>
    <div id="app"><main class="startup-screen"><h1>Codex</h1><p id="startup-status" role="status">正在打开…</p><button id="startup-retry" type="button" hidden>重新打开</button></main></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

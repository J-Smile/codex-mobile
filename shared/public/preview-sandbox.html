<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <title>HTML 预览</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    html { color-scheme: light; background: Canvas; }
    iframe { display: block; }
  </style>
</head>
<body>
  <iframe title="HTML 文件" sandbox="allow-scripts"></iframe>
  <script>
    function renderPreview(event) {
      if (event.source !== parent || parent === window || event.data?.type !== 'codex-html-preview' || typeof event.data.html !== 'string') return;
      window.removeEventListener('message', renderPreview);
      document.querySelector('iframe').srcdoc = event.data.html;
    }
    window.addEventListener('message', renderPreview);
  </script>
</body>
</html>

name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布正式版本供桌面自动更新（版本号取自所选分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            architecture: x64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - run: npm ci
      - name: Check release versions
        id: version
        run: npm run release:check
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Configure Windows release profile
        if: runner.os == 'Windows'
        # 在恢复缓存前导出，让编译配置参与缓存键计算。
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_PROFILE_RELEASE_LTO=false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows 旧缓存由取消的作业写入，缺少 release 编译产物。
          key: ${{ runner.os == 'Windows' && 'windows-x64-package' || matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: npm run test:native
      - run: npm run test:relay
      - run: cargo clippy --locked -p codex-mobile-bridge -p codex-mobile-relay --all-targets -- -D warnings
      - run: npm run package
      - run: cargo clippy --locked -p codex-mobile-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
            dist/release/*-setup.dmg
            dist/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mobile-*
          path: dist/release
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::正式版本 $RELEASE_TAG 已发布。请提高版本号后重新运行，不能覆盖桌面已安装的同版本。"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          本次更新

          - 已配对和“待配对”电脑均可从云账号移除；撤销设备凭据、关闭云连接并同步其他手机，重新扫码才能添加。保留“仅移除此手机配对”，电脑上的聊天和文件不受影响。
          - Windows 带图消息改为同一官方桌面实例的原生图片附件，支持纯图、文图、多图及带图新建，不再发送“图片引用”。纯文字仍经官方 App Tools，新建仍由官方创建并只提交一次首轮。
          - 执行/规划模式在控制连接恢复后可切换；连接未就绪时明确显示启用方式。图片草稿保留，旧连接不会降级为文字引用。
          - 保留原有配对、权限、模型与思考强度、草稿及操作账本；重复图片请求只生成一个轮次，失败或未知结果不自动重发。

          启用控制：使用 Windows 默认 Codex 目录和受支持的官方桌面版本；待当前官方桌面任务结束后，退出官方 Codex，再从新版 Mobile 的“打开 Codex”入口启动。旧版后台运行时不会阻挡新实例，安装更新不会自动重启官方桌面。云连接的服务器网页与桌面客户端需分别更新。

          本版通过真实手机 HTTP 到隔离官方桌面的纯图、文图、多图及带图新建验收，确认官方 localImage 附件、随机标记识别、模型/思考强度和请求去重；执行/规划切换经官方回读确认。云移除通过真实隔离 relay 服务与三视口双手机浏览器验证，未删除用户真实电脑。

          既有完整产品实机缺口保留：真实浏览器读取在隔离 Windows 环境遇到权限错误，聊天删除、委派执行、新建目标整链路、实体 Safari/PWA 和安装切换尚未全部验收。审批仅验证官方 schema 与合成协议，没有批准真实业务操作。macOS 与非默认 Codex 目录继续提供历史阅读。

          运行包无需 Node.js。Windows 使用安装程序或完整 ZIP，macOS 使用 DMG 或完整 ZIP。旧客户端若无法检查更新，请手动安装一次本版本；同版本重新打包不会触发自动升级。
          EOF
          if [ "$existing" = true ]; then
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --notes-file release-notes.md --title "Codex Mobile $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

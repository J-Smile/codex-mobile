name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布正式版本供桌面自动更新（版本号取自所选分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            architecture: x64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - run: npm ci
      - name: Check release versions
        id: version
        run: npm run release:check
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Configure Windows release profile
        if: runner.os == 'Windows'
        # 在恢复缓存前导出，让编译配置参与缓存键计算。
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_PROFILE_RELEASE_LTO=false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows 旧缓存由取消的作业写入，缺少 release 编译产物。
          key: ${{ runner.os == 'Windows' && 'windows-x64-package' || matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: npm run test:native
      - run: npm run test:relay
      - run: cargo clippy --locked -p codex-mobile-bridge -p codex-mobile-relay --all-targets -- -D warnings
      - run: npm run package
      - run: cargo clippy --locked -p codex-mobile-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
            dist/release/*-setup.dmg
            dist/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mobile-*
          path: dist/release
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::正式版本 $RELEASE_TAG 已发布。请提高版本号后重新运行，不能覆盖桌面已安装的同版本。"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          本次更新

          - 统一发送与新建的提交生命周期，修复已完成请求仍停留在等待状态的问题；未知结果不自动重发。
          - 修复图片、文字和模型草稿恢复，以及横屏输入区、问题卡片和新建页面的状态切换。
          - 支持项目文件与聊天文字引用、只读 Hooks 查看，以及桌面支持时的聊天定位。
          - 桌面升级显示真实下载、校验和解压进度，减少后台读取对聊天同步的影响。
          - 网页升级等待对应版本资源准备完成后才保存草稿并刷新；安装失败保留页面，旧缓存完成迁移后回收。

          云连接需要同时更新服务器网页和 Windows 桌面端。图片通过本地文件引用交给 Codex 读取。问题回复、审批、停止、异常继续、队列控制、权限/模式/目标修改仍需在官方桌面完成，不能视为全功能恢复。macOS 与非默认 Codex 目录继续提供历史阅读，实体 Safari/PWA 尚未完整验收。

          运行包无需 Node.js。Windows 使用安装程序或完整 ZIP，macOS 使用 DMG 或完整 ZIP。旧客户端若无法检查更新，请手动安装一次本版本；同版本重新打包不会触发自动升级。
          EOF
          if [ "$existing" = true ]; then
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --notes-file release-notes.md --title "Codex Mobile $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布正式版本供桌面自动更新（版本号取自所选分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            architecture: x64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - run: npm ci
      - name: Check release versions
        id: version
        run: npm run release:check
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Configure Windows release profile
        if: runner.os == 'Windows'
        # 在恢复缓存前导出，让编译配置参与缓存键计算。
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_PROFILE_RELEASE_LTO=false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows 旧缓存由取消的作业写入，缺少 release 编译产物。
          key: ${{ runner.os == 'Windows' && 'windows-x64-package' || matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: npm run test:native
      - run: npm run test:relay
      - run: cargo clippy --locked -p codex-mobile-bridge -p codex-mobile-relay --all-targets -- -D warnings
      - run: npm run package
      - run: cargo clippy --locked -p codex-mobile-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*-setup.exe
            release/*-setup.dmg
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mobile-*
          path: release
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::正式版本 $RELEASE_TAG 已发布。请提高版本号后重新运行，不能覆盖桌面已安装的同版本。"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          本次更新

          - 加快手机聊天首屏加载与桌面同步，减少重复历史读取，已有正文可更早显示。
          - 流式回复复用未变化的工具分组，减少重复渲染，保留工具展开状态和阅读位置。
          - 离开聊天、断开登录或返回文字输入时释放语音识别，避免语音状态阻塞后续发送，并保留草稿。
          - 手机对话列表恢复「全部项目」，按官方桌面已保存的项目和对话归属分组。
          - 精简聊天页的固定同步频率、发送方式、停止、设置和审批说明。
          - 移除默认中转服务器，云连接需填写自己的地址；电脑名称留空时使用通用名称，不再自动读取系统主机名。旧版已保存的地址可在云连接设置中清空。

          运行包无需 Node.js。Windows 使用安装程序或完整 ZIP，macOS 使用 DMG 或完整 ZIP。内置更新器需要该仓库的 Contents: read token。
          EOF
          if [ "$existing" = true ]; then
            gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --notes-file release-notes.md --title "Codex Mobile $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布正式版本供桌面自动更新（版本号取自所选分支）'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            architecture: x64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.architecture }}
          cache: npm
      - run: npm ci
      - name: Check release versions
        id: version
        run: npm run release:check
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Configure Windows release profile
        if: runner.os == 'Windows'
        # 在恢复缓存前导出，让编译配置参与缓存键计算。
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CARGO_PROFILE_RELEASE_LTO=false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows 旧缓存由取消的作业写入，缺少 release 编译产物。
          key: ${{ runner.os == 'Windows' && 'windows-x64-package' || matrix.platform }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: cargo fmt --all -- --check
      - run: npm run test:native
      - run: npm run test:relay
      - run: cargo clippy --locked -p codex-mobile-bridge -p codex-mobile-relay --all-targets -- -D warnings
      - run: npm run package
      - run: cargo clippy --locked -p codex-mobile-desktop --all-targets -- -D warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: |
            dist/release/*.zip
            dist/release/*-setup.exe
            dist/release/*-setup.dmg
            dist/release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-mobile-*
          path: dist/release
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$existing" = false ]; then
            echo "::error::正式版本 $RELEASE_TAG 已发布。请提高版本号后重新运行，不能覆盖桌面已安装的同版本。"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          本次更新

          - Windows 手机端接通问题回复、审批、当前轮次停止、失败或中断后继续，以及官方队列新增、编辑、排序、删除和空闲立即执行。
          - 普通创建、发送、异步答案和继续由官方 Codex 桌面工具执行；审批、停止和队列连接同一个官方桌面实例，沿用官方模型与权限。
          - 手机断开后官方任务继续运行，重连恢复原轮次和仍待处理的审批；中断后保留未执行队列，答案投递与问题结束分别记录，避免刷新后重复发送。
          - 补充同实例控制、退订重入和自动重连回归，保留原配对、草稿、图片及操作记录。

          启用控制：使用 Windows 默认 Codex 目录和受支持的官方桌面版本；待官方任务及旧共享运行时任务结束后，退出旧版连接与官方 Codex，再从新版 Mobile 的“打开 Codex”入口启动。安装更新不会自动重启官方桌面。云连接的服务器网页与桌面客户端需分别更新。

          Windows 正式启动链、手机 HTTP 停止/继续、官方队列及断线恢复已完成非窗口验收。审批按用户限定只验收官方 schema 与合成表单/协议，没有批准真实业务操作。macOS 与非默认 Codex 目录继续提供历史阅读；权限配置、执行/规划模式和目标修改仍未开放，实体 Safari/PWA 及实际安装切换尚未完整验收。图片继续通过本地文件引用交给 Codex 读取。

          运行包无需 Node.js。Windows 使用安装程序或完整 ZIP，macOS 使用 DMG 或完整 ZIP。旧客户端若无法检查更新，请手动安装一次本版本；同版本重新打包不会触发自动升级。
          EOF
          if [ "$existing" = true ]; then
            gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --generate-notes --notes-file release-notes.md --title "Codex Mobile $RELEASE_TAG"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
